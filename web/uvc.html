<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>iPadMirror - Wired</title>

    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;

            background: #000;
            color: #fff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        #stage {
            position: fixed;
            inset: 0;

            overflow: hidden;
            background: #000;
        }

        #video {
            position: absolute;

            left: 50%;
            top: 50%;

            display: block;

            width: auto;
            height: auto;

            max-width: none;
            max-height: none;

            background: #000;

            transform-origin: center center;

            will-change: transform;
        }

        #controls {
            position: fixed;

            top: 12px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 10;

            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;

            gap: 8px;

            width: min(1100px, calc(100vw - 24px));

            padding: 10px;

            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 12px;

            background: rgba(20, 20, 20, 0.90);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            transition:
                width 0.2s ease,
                left 0.2s ease,
                top 0.2s ease,
                transform 0.2s ease,
                padding 0.2s ease;
        }

        #controls.collapsed {
            top: 12px;
            left: 12px;

            width: auto;
            min-width: 0;

            padding: 6px;

            transform: none;
        }

        #controls.collapsed > *:not(#collapseButton) {
            display: none;
        }

        #controls.collapsed #collapseButton {
            display: block;

            width: 38px;
            min-width: 38px;
            height: 38px;

            padding: 0;

            font-size: 18px;
        }

        select,
        button {
            min-height: 38px;

            padding: 7px 12px;

            border: 1px solid #555;
            border-radius: 7px;

            background: #262626;
            color: #fff;

            font-size: 14px;
        }

        select {
            min-width: 260px;
            max-width: 420px;
        }

        button {
            cursor: pointer;
        }

        button:hover {
            background: #383838;
        }

        button:disabled {
            opacity: 0.45;
            cursor: default;
        }

        #collapseButton {
            min-width: 38px;

            padding-left: 10px;
            padding-right: 10px;

            font-size: 17px;
        }

        #startButton {
            background: #176b36;
            border-color: #26884c;
        }

        #startButton:hover {
            background: #1d8142;
        }

        #stopButton {
            background: #702828;
            border-color: #8a3434;
        }

        #stopButton:hover {
            background: #853030;
        }

        #message {
            position: fixed;

            left: 50%;
            bottom: 18px;

            transform: translateX(-50%);

            z-index: 10;

            max-width: calc(100vw - 30px);

            padding: 8px 14px;

            border-radius: 8px;

            background: rgba(20, 20, 20, 0.85);

            color: #ddd;

            font-size: 13px;
            text-align: center;

            pointer-events: none;

            transition:
                opacity 0.2s ease,
                visibility 0.2s ease;
        }

        #message.collapsed {
            opacity: 0;
            visibility: hidden;
        }

        #message.live {
            color: #8ee6a8;
        }

        #message.error {
            color: #ff9696;
        }

        #startup {
            position: fixed;
            inset: 0;

            z-index: 5;

            display: flex;
            align-items: center;
            justify-content: center;

            pointer-events: none;
        }

        #startupContent {
            padding: 30px;

            color: #aaa;
            text-align: center;
        }

        #startupContent h1 {
            margin: 0 0 8px 0;

            color: #fff;

            font-size: 32px;
            font-weight: 500;
        }

        #startupContent p {
            margin: 0;

            font-size: 15px;
        }

        #diagnostics {
            margin-left: 4px;

            color: #aaa;

            font-size: 12px;
            white-space: nowrap;
        }

        @media (max-width: 800px) {

            #controls:not(.collapsed) {
                justify-content: flex-start;
            }

            #controls:not(.collapsed) select {
                width: 100%;
                max-width: none;
            }

            #controls:not(.collapsed) #diagnostics {
                width: 100%;

                margin-left: 0;

                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div id="stage">

        <video
            id="video"
            autoplay
            playsinline
            muted
        ></video>

    </div>

    <div id="startup">

        <div id="startupContent">

            <h1>
                iPadMirror
            </h1>

            <p>
                Connect the UVC capture device and click Start Capture.
            </p>

        </div>

    </div>

    <div id="controls">

        <button
            id="collapseButton"
            type="button"
            title="Hide controls"
        >
            ▲
        </button>

        <select
            id="deviceSelect"
            aria-label="Video capture device"
        >
            <option value="">
                Loading video devices...
            </option>
        </select>

        <button
            id="refreshButton"
            type="button"
        >
            Refresh
        </button>

        <button
            id="startButton"
            type="button"
        >
            Start Capture
        </button>

        <button
            id="stopButton"
            type="button"
            disabled
        >
            Stop
        </button>

        <button
            id="rotateLeftButton"
            type="button"
            title="Rotate counterclockwise"
        >
            ↺ 90°
        </button>

        <button
            id="rotateRightButton"
            type="button"
            title="Rotate clockwise"
        >
            ↻ 90°
        </button>

        <button
            id="fitButton"
            type="button"
            title="Scale video to maximum available window size"
        >
            Fill
        </button>

        <button
            id="fullscreenButton"
            type="button"
        >
            Fullscreen
        </button>

        <div id="diagnostics">
            No active video
        </div>

    </div>

    <div id="message">
        Waiting for capture device.
    </div>

    <script>
        "use strict";


        /*
        ------------------------------------------------------------
        Elements
        ------------------------------------------------------------
        */

        const stage =
            document.getElementById("stage");

        const video =
            document.getElementById("video");

        const controls =
            document.getElementById("controls");

        const collapseButton =
            document.getElementById("collapseButton");

        const deviceSelect =
            document.getElementById("deviceSelect");

        const refreshButton =
            document.getElementById("refreshButton");

        const startButton =
            document.getElementById("startButton");

        const stopButton =
            document.getElementById("stopButton");

        const rotateLeftButton =
            document.getElementById("rotateLeftButton");

        const rotateRightButton =
            document.getElementById("rotateRightButton");

        const fitButton =
            document.getElementById("fitButton");

        const fullscreenButton =
            document.getElementById("fullscreenButton");

        const diagnostics =
            document.getElementById("diagnostics");

        const message =
            document.getElementById("message");

        const startup =
            document.getElementById("startup");


        /*
        ------------------------------------------------------------
        State
        ------------------------------------------------------------
        */

        const SAVED_DEVICE_KEY =
            "iPadMirrorUVCDevice";


        let stream = null;

        let rotation = 0;

        let fillMode = false;

        let permissionGranted = false;

        let controlsCollapsed = false;


        const preferredDeviceWords = [
            "clariview",
            "capture",
            "usb video",
            "uvc",
            "hdmi",
            "cam link",
            "avermedia",
            "magewell",
            "video capture"
        ];


        /*
        ------------------------------------------------------------
        Status
        ------------------------------------------------------------
        */

        function setMessage(text, type = "") {

            message.textContent =
                text;


            message.classList.remove(
                "live",
                "error"
            );


            if (type) {

                message.classList.add(
                    type
                );
            }
        }


        /*
        ------------------------------------------------------------
        Collapse / expand controls
        ------------------------------------------------------------
        */

        function toggleControls() {

            controlsCollapsed =
                !controlsCollapsed;


            controls.classList.toggle(
                "collapsed",
                controlsCollapsed
            );


            message.classList.toggle(
                "collapsed",
                controlsCollapsed
            );


            collapseButton.textContent =
                controlsCollapsed
                    ? "▼"
                    : "▲";


            collapseButton.title =
                controlsCollapsed
                    ? "Show controls"
                    : "Hide controls";
        }


        /*
        ------------------------------------------------------------
        Browser support
        ------------------------------------------------------------
        */

        function checkSupport() {

            if (!window.isSecureContext) {

                throw new Error(
                    "This page must be opened over HTTPS."
                );
            }


            if (
                !navigator.mediaDevices ||
                !navigator.mediaDevices.getUserMedia ||
                !navigator.mediaDevices.enumerateDevices
            ) {

                throw new Error(
                    "This browser does not support camera capture."
                );
            }
        }


        /*
        ------------------------------------------------------------
        Device scoring
        ------------------------------------------------------------
        */

        function getDeviceScore(device) {

            const label =
                (device.label || "")
                    .toLowerCase();


            let score = 0;


            for (
                let i = 0;
                i < preferredDeviceWords.length;
                i++
            ) {

                if (
                    label.includes(
                        preferredDeviceWords[i]
                    )
                ) {

                    score +=
                        100 - i;
                }
            }


            if (
                label.includes("integrated") ||
                label.includes("facetime") ||
                label.includes("front camera") ||
                label.includes("webcam")
            ) {

                score -= 50;
            }


            return score;
        }


        /*
        ------------------------------------------------------------
        Camera permission
        ------------------------------------------------------------
        */

        async function requestPermission() {

            if (permissionGranted) {
                return;
            }


            setMessage(
                "Requesting camera permission..."
            );


            const temporaryStream =
                await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                });


            temporaryStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );


            permissionGranted =
                true;
        }


        /*
        ------------------------------------------------------------
        Enumerate devices
        ------------------------------------------------------------
        */

        async function refreshDevices(
            requestCameraPermission = false
        ) {

            checkSupport();


            const previousSelection =
                deviceSelect.value;


            const savedSelection =
                localStorage.getItem(
                    SAVED_DEVICE_KEY
                );


            if (requestCameraPermission) {

                await requestPermission();
            }


            const devices =
                await navigator.mediaDevices
                    .enumerateDevices();


            const videoDevices =
                devices.filter(
                    device =>
                        device.kind ===
                        "videoinput"
                );


            deviceSelect.innerHTML = "";


            if (videoDevices.length === 0) {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value = "";


                option.textContent =
                    "No video devices found";


                deviceSelect.appendChild(
                    option
                );


                startButton.disabled =
                    true;


                setMessage(
                    "No Windows video capture devices were found.",
                    "error"
                );


                return;
            }


            startButton.disabled =
                false;


            videoDevices.forEach(
                (device, index) => {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        device.deviceId;


                    option.textContent =
                        device.label ||
                        `Camera ${index + 1}`;


                    deviceSelect.appendChild(
                        option
                    );
                }
            );


            let selectedDevice =
                videoDevices.find(
                    device =>
                        device.deviceId ===
                        previousSelection
                );


            if (!selectedDevice) {

                selectedDevice =
                    videoDevices.find(
                        device =>
                            device.deviceId ===
                            savedSelection
                    );
            }


            if (!selectedDevice) {

                const sortedDevices =
                    [...videoDevices]
                        .sort(
                            (a, b) =>
                                getDeviceScore(b) -
                                getDeviceScore(a)
                        );


                selectedDevice =
                    sortedDevices[0];
            }


            if (selectedDevice) {

                deviceSelect.value =
                    selectedDevice.deviceId;
            }


            setMessage(
                `${videoDevices.length} video device` +
                `${videoDevices.length === 1 ? "" : "s"} found.`
            );
        }


        /*
        ------------------------------------------------------------
        Rotation normalization
        ------------------------------------------------------------
        */

        function normalizeRotation() {

            rotation =
                ((rotation % 360) + 360) %
                360;
        }


        /*
        ------------------------------------------------------------
        Video sizing
        ------------------------------------------------------------

        No cropping is performed.

        FIT:
            - Complete video is always visible.
            - Video may shrink.
            - Video will not enlarge past native resolution.

        FILL:
            - Complete video is always visible.
            - Video may shrink.
            - Video may enlarge.
            - Video uses as much of the window as possible.
            - No content is cropped.

        Rotation is accounted for before calculating scale.
        ------------------------------------------------------------
        */

        function updateVideoLayout() {

            normalizeRotation();


            const videoWidth =
                video.videoWidth;


            const videoHeight =
                video.videoHeight;


            const stageWidth =
                stage.clientWidth;


            const stageHeight =
                stage.clientHeight;


            if (
                !videoWidth ||
                !videoHeight ||
                !stageWidth ||
                !stageHeight
            ) {

                return;
            }


            /*
            Never crop the incoming UVC frame.
            */

            video.style.clipPath =
                "none";


            /*
            A 90° or 270° rotation swaps the effective
            display width and height.
            */

            const quarterTurn =
                rotation === 90 ||
                rotation === 270;


            const displayWidth =
                quarterTurn
                    ? videoHeight
                    : videoWidth;


            const displayHeight =
                quarterTurn
                    ? videoWidth
                    : videoHeight;


            /*
            Leave a tiny amount of clearance so browser
            sub-pixel rounding cannot clip an outside edge.
            */

            const padding =
                4;


            const availableWidth =
                Math.max(
                    stageWidth - padding,
                    1
                );


            const availableHeight =
                Math.max(
                    stageHeight - padding,
                    1
                );


            /*
            Maximum scale that preserves the ENTIRE frame.
            */

            const availableScale =
                Math.min(
                    availableWidth /
                        displayWidth,

                    availableHeight /
                        displayHeight
                );


            /*
            Fit:
                Allow shrinking but not enlargement.

            Fill:
                Allow enlargement or shrinking.
            */

            const scale =
                fillMode
                    ? availableScale
                    : Math.min(
                        availableScale,
                        1
                    );


            /*
            Keep the video element at the source resolution.
            Transformation handles rotation and scaling.
            */

            video.style.width =
                `${videoWidth}px`;


            video.style.height =
                `${videoHeight}px`;


            video.style.transform =
                `translate(-50%, -50%) ` +
                `rotate(${rotation}deg) ` +
                `scale(${scale})`;
        }


        /*
        ------------------------------------------------------------
        Stop capture
        ------------------------------------------------------------
        */

        function stopCapture(
            updateMessage = true
        ) {

            if (stream) {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );
            }


            stream =
                null;


            video.srcObject =
                null;


            video.style.clipPath =
                "none";


            video.style.transform =
                "translate(-50%, -50%)";


            startup.style.display =
                "flex";


            startButton.disabled =
                false;


            stopButton.disabled =
                true;


            diagnostics.textContent =
                "No active video";


            if (updateMessage) {

                setMessage(
                    "Capture stopped."
                );
            }
        }


        /*
        ------------------------------------------------------------
        Start capture
        ------------------------------------------------------------
        */

        async function startCapture() {

            try {

                checkSupport();


                startButton.disabled =
                    true;


                setMessage(
                    "Preparing video devices..."
                );


                await refreshDevices(true);


                const deviceId =
                    deviceSelect.value;


                if (!deviceId) {

                    throw new Error(
                        "No video device is selected."
                    );
                }


                stopCapture(false);


                setMessage(
                    "Starting capture..."
                );


                const preferredConstraints = {

                    audio: false,

                    video: {

                        deviceId: {
                            exact: deviceId
                        },

                        width: {
                            ideal: 1920
                        },

                        height: {
                            ideal: 1080
                        },

                        frameRate: {
                            ideal: 60,
                            max: 60
                        }
                    }
                };


                try {

                    stream =
                        await navigator.mediaDevices
                            .getUserMedia(
                                preferredConstraints
                            );

                } catch (error) {

                    console.warn(
                        "Preferred capture mode failed. " +
                        "Retrying with device defaults.",
                        error
                    );


                    stream =
                        await navigator.mediaDevices
                            .getUserMedia({

                                audio: false,

                                video: {

                                    deviceId: {
                                        exact: deviceId
                                    }
                                }
                            });
                }


                video.srcObject =
                    stream;


                await video.play();


                updateVideoLayout();


                const track =
                    stream.getVideoTracks()[0];


                const settings =
                    track.getSettings();


                const width =
                    settings.width ||
                    video.videoWidth ||
                    "?";


                const height =
                    settings.height ||
                    video.videoHeight ||
                    "?";


                const fps =
                    settings.frameRate
                        ? Math.round(
                            settings.frameRate
                        )
                        : "?";


                diagnostics.textContent =
                    `${track.label || "Video Capture"} ` +
                    `• ${width}×${height} ` +
                    `• ${fps} fps`;


                localStorage.setItem(
                    SAVED_DEVICE_KEY,
                    deviceId
                );


                startup.style.display =
                    "none";


                startButton.disabled =
                    true;


                stopButton.disabled =
                    false;


                setMessage(
                    "Wired capture is live.",
                    "live"
                );


                track.addEventListener(
                    "ended",
                    () => {

                        stream =
                            null;


                        video.srcObject =
                            null;


                        startup.style.display =
                            "flex";


                        startButton.disabled =
                            false;


                        stopButton.disabled =
                            true;


                        diagnostics.textContent =
                            "Capture device disconnected";


                        setMessage(
                            "Capture device disconnected.",
                            "error"
                        );
                    }
                );

            } catch (error) {

                console.error(
                    error
                );


                startButton.disabled =
                    false;


                stopButton.disabled =
                    true;


                showCaptureError(
                    error
                );
            }
        }


        /*
        ------------------------------------------------------------
        Friendly capture errors
        ------------------------------------------------------------
        */

        function showCaptureError(error) {

            let text =
                error.message ||
                String(error);


            switch (error.name) {

                case "NotAllowedError":

                    text =
                        "Camera access was denied. " +
                        "Allow camera access for this site in the browser.";

                    break;


                case "NotFoundError":

                    text =
                        "No compatible video capture device was found.";

                    break;


                case "NotReadableError":

                    text =
                        "The capture device exists but Windows could not open it. " +
                        "Close any other program using the device and try again.";

                    break;


                case "OverconstrainedError":

                    text =
                        "The selected video device could not satisfy the requested video mode.";

                    break;


                case "SecurityError":

                    text =
                        "The browser or computer security policy blocked camera access.";

                    break;
            }


            setMessage(
                text,
                "error"
            );
        }


        /*
        ------------------------------------------------------------
        Rotation
        ------------------------------------------------------------
        */

        function rotateLeft() {

            rotation -=
                90;


            updateVideoLayout();
        }


        function rotateRight() {

            rotation +=
                90;


            updateVideoLayout();
        }


        /*
        ------------------------------------------------------------
        Fit / Fill
        ------------------------------------------------------------
        */

        function toggleFit() {

            fillMode =
                !fillMode;


            /*
            Button text indicates the mode clicking it
            will switch TO.
            */

            fitButton.textContent =
                fillMode
                    ? "Fit"
                    : "Fill";


            fitButton.title =
                fillMode
                    ? "Return to native size or smaller"
                    : "Maximize video while keeping the entire screen visible";


            updateVideoLayout();
        }


        /*
        ------------------------------------------------------------
        Fullscreen
        ------------------------------------------------------------
        */

        async function toggleFullscreen() {

            try {

                if (
                    !document.fullscreenElement
                ) {

                    await document
                        .documentElement
                        .requestFullscreen();

                } else {

                    await document
                        .exitFullscreen();
                }

            } catch (error) {

                console.error(
                    error
                );


                setMessage(
                    "Fullscreen mode was blocked by the browser.",
                    "error"
                );
            }
        }


        /*
        ------------------------------------------------------------
        Buttons
        ------------------------------------------------------------
        */

        collapseButton.addEventListener(
            "click",
            toggleControls
        );


        refreshButton.addEventListener(
            "click",
            async () => {

                try {

                    await refreshDevices(
                        true
                    );

                } catch (error) {

                    console.error(
                        error
                    );


                    showCaptureError(
                        error
                    );
                }
            }
        );


        startButton.addEventListener(
            "click",
            startCapture
        );


        stopButton.addEventListener(
            "click",
            () =>
                stopCapture(
                    true
                )
        );


        rotateLeftButton.addEventListener(
            "click",
            rotateLeft
        );


        rotateRightButton.addEventListener(
            "click",
            rotateRight
        );


        fitButton.addEventListener(
            "click",
            toggleFit
        );


        fullscreenButton.addEventListener(
            "click",
            toggleFullscreen
        );


        /*
        ------------------------------------------------------------
        Video sizing events
        ------------------------------------------------------------
        */

        video.addEventListener(
            "loadedmetadata",
            updateVideoLayout
        );


        video.addEventListener(
            "resize",
            updateVideoLayout
        );


        window.addEventListener(
            "resize",
            updateVideoLayout
        );


        document.addEventListener(
            "fullscreenchange",
            () => {

                requestAnimationFrame(
                    updateVideoLayout
                );
            }
        );


        /*
        ------------------------------------------------------------
        Remember selected device
        ------------------------------------------------------------
        */

        deviceSelect.addEventListener(
            "change",
            () => {

                if (
                    deviceSelect.value
                ) {

                    localStorage.setItem(
                        SAVED_DEVICE_KEY,
                        deviceSelect.value
                    );
                }
            }
        );


        /*
        ------------------------------------------------------------
        Capture device plug / unplug
        ------------------------------------------------------------
        */

        if (
            navigator.mediaDevices &&
            "addEventListener" in
                navigator.mediaDevices
        ) {

            navigator.mediaDevices
                .addEventListener(
                    "devicechange",
                    async () => {

                        try {

                            await refreshDevices(
                                false
                            );

                        } catch (error) {

                            console.error(
                                error
                            );
                        }
                    }
                );
        }


        /*
        ------------------------------------------------------------
        Initialize
        ------------------------------------------------------------
        */

        async function initialize() {

            try {

                checkSupport();


                await refreshDevices(
                    false
                );


                setMessage(
                    "Connect the capture card and click Start Capture."
                );

            } catch (error) {

                console.error(
                    error
                );


                startButton.disabled =
                    true;


                refreshButton.disabled =
                    true;


                showCaptureError(
                    error
                );
            }
        }


        initialize();

    </script>

</body>
</html>
