<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>iPadMirror - Wired</title>

    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;

            background: #000;
            color: #fff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        #stage {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background: #000;
        }

        /*
        Source UVC video is hidden.
        The canvas is what the user actually sees.
        */
        #sourceVideo {
            position: fixed;

            left: -10000px;
            top: -10000px;

            width: 1px;
            height: 1px;

            opacity: 0;

            pointer-events: none;
        }

        #outputCanvas {
            display: block;

            margin: 0;
            padding: 0;

            background: #000;
        }

        #controls {
            position: fixed;

            top: 12px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 10;

            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;

            gap: 8px;

            width: min(
                1100px,
                calc(100vw - 24px)
            );

            padding: 10px;

            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 12px;

            background: rgba(20, 20, 20, 0.90);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        #controls.collapsed {
            top: 12px;
            left: 12px;

            width: auto;
            min-width: 0;

            padding: 6px;

            transform: none;
        }

        #controls.collapsed > *:not(#collapseButton) {
            display: none;
        }

        #controls.collapsed #collapseButton {
            display: block;

            width: 38px;
            min-width: 38px;
            height: 38px;

            padding: 0;

            font-size: 18px;
        }

        select,
        button {
            min-height: 38px;

            padding: 7px 12px;

            border: 1px solid #555;
            border-radius: 7px;

            background: #262626;
            color: #fff;

            font-size: 14px;
        }

        select {
            min-width: 260px;
            max-width: 420px;
        }

        button {
            cursor: pointer;
        }

        button:hover {
            background: #383838;
        }

        button:disabled {
            opacity: 0.45;
            cursor: default;
        }

        #collapseButton {
            min-width: 38px;

            padding-left: 10px;
            padding-right: 10px;

            font-size: 17px;
        }

        #startButton {
            background: #176b36;
            border-color: #26884c;
        }

        #startButton:hover {
            background: #1d8142;
        }

        #stopButton {
            background: #702828;
            border-color: #8a3434;
        }

        #stopButton:hover {
            background: #853030;
        }

        #diagnostics {
            margin-left: 4px;

            color: #aaa;

            font-size: 12px;
            white-space: nowrap;
        }

        #message {
            position: fixed;

            left: 50%;
            bottom: 18px;

            transform: translateX(-50%);

            z-index: 10;

            max-width: calc(100vw - 30px);

            padding: 8px 14px;

            border-radius: 8px;

            background: rgba(20, 20, 20, 0.85);

            color: #ddd;

            font-size: 13px;
            text-align: center;

            pointer-events: none;

            transition:
                opacity 0.2s ease,
                visibility 0.2s ease;
        }

        #message.collapsed {
            opacity: 0;
            visibility: hidden;
        }

        #message.live {
            color: #8ee6a8;
        }

        #message.error {
            color: #ff9696;
        }

        #startup {
            position: fixed;
            inset: 0;

            z-index: 5;

            display: flex;
            align-items: center;
            justify-content: center;

            pointer-events: none;
        }

        #startupContent {
            padding: 30px;

            color: #aaa;
            text-align: center;
        }

        #startupContent h1 {
            margin: 0 0 8px 0;

            color: #fff;

            font-size: 32px;
            font-weight: 500;
        }

        #startupContent p {
            margin: 0;

            font-size: 15px;
        }

        @media (max-width: 800px) {

            #controls:not(.collapsed) {
                justify-content: flex-start;
            }

            #controls:not(.collapsed) select {
                width: 100%;
                max-width: none;
            }

            #controls:not(.collapsed) #diagnostics {
                width: 100%;

                margin-left: 0;

                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div id="stage">

        <video
            id="sourceVideo"
            autoplay
            playsinline
            muted
        ></video>

        <canvas
            id="outputCanvas"
        ></canvas>

    </div>

    <div id="startup">

        <div id="startupContent">

            <h1>
                iPadMirror
            </h1>

            <p>
                Connect the UVC capture device and click Start Capture.
            </p>

        </div>

    </div>

    <div id="controls">

        <button
            id="collapseButton"
            type="button"
            title="Hide controls"
        >
            ▲
        </button>

        <select
            id="deviceSelect"
            aria-label="Video capture device"
        >
            <option value="">
                Loading video devices...
            </option>
        </select>

        <button
            id="refreshButton"
            type="button"
        >
            Refresh
        </button>

        <button
            id="startButton"
            type="button"
        >
            Start Capture
        </button>

        <button
            id="stopButton"
            type="button"
            disabled
        >
            Stop
        </button>

        <button
            id="rotateLeftButton"
            type="button"
            title="Rotate counterclockwise"
        >
            ↺ 90°
        </button>

        <button
            id="rotateRightButton"
            type="button"
            title="Rotate clockwise"
        >
            ↻ 90°
        </button>

        <button
            id="fullscreenButton"
            type="button"
        >
            Fullscreen
        </button>

        <div id="diagnostics">
            No active video
        </div>

    </div>

    <div id="message">
        Waiting for capture device.
    </div>


    <script>
        "use strict";


        /*
        ============================================================
        Elements
        ============================================================
        */

        const stage =
            document.getElementById(
                "stage"
            );

        const sourceVideo =
            document.getElementById(
                "sourceVideo"
            );

        const outputCanvas =
            document.getElementById(
                "outputCanvas"
            );

        const outputContext =
            outputCanvas.getContext(
                "2d",
                {
                    alpha: false
                }
            );

        const controls =
            document.getElementById(
                "controls"
            );

        const collapseButton =
            document.getElementById(
                "collapseButton"
            );

        const deviceSelect =
            document.getElementById(
                "deviceSelect"
            );

        const refreshButton =
            document.getElementById(
                "refreshButton"
            );

        const startButton =
            document.getElementById(
                "startButton"
            );

        const stopButton =
            document.getElementById(
                "stopButton"
            );

        const rotateLeftButton =
            document.getElementById(
                "rotateLeftButton"
            );

        const rotateRightButton =
            document.getElementById(
                "rotateRightButton"
            );

        const fullscreenButton =
            document.getElementById(
                "fullscreenButton"
            );

        const diagnostics =
            document.getElementById(
                "diagnostics"
            );

        const message =
            document.getElementById(
                "message"
            );

        const startup =
            document.getElementById(
                "startup"
            );


        /*
        ============================================================
        Detection canvas
        ============================================================
        */

        const detectionCanvas =
            document.createElement(
                "canvas"
            );

        const detectionContext =
            detectionCanvas.getContext(
                "2d",
                {
                    willReadFrequently: true
                }
            );


        /*
        ============================================================
        State
        ============================================================
        */

        const SAVED_DEVICE_KEY =
            "iPadMirrorUVCDevice";


        const DETECTION_WIDTH =
            320;

        const DETECTION_INTERVAL =
            500;

        const BLACK_THRESHOLD =
            24;

        const BLACK_COLUMN_RATIO =
            0.99;


        let stream =
            null;

        let rotation =
            0;

        let permissionGranted =
            false;

        let controlsCollapsed =
            false;

        let rendering =
            false;

        let lastDetectionTime =
            0;


        let activeRect = {
            x: 0,
            y: 0,
            width: 0,
            height: 0
        };


        const preferredDeviceWords = [
            "clariview",
            "capture",
            "usb video",
            "uvc",
            "hdmi",
            "cam link",
            "avermedia",
            "magewell",
            "video capture"
        ];


        /*
        ============================================================
        Status
        ============================================================
        */

        function setMessage(
            text,
            type = ""
        ) {

            message.textContent =
                text;


            message.classList.remove(
                "live",
                "error"
            );


            if (type) {

                message.classList.add(
                    type
                );
            }
        }


        /*
        ============================================================
        Controls
        ============================================================
        */

        function toggleControls() {

            controlsCollapsed =
                !controlsCollapsed;


            controls.classList.toggle(
                "collapsed",
                controlsCollapsed
            );


            message.classList.toggle(
                "collapsed",
                controlsCollapsed
            );


            collapseButton.textContent =
                controlsCollapsed
                    ? "▼"
                    : "▲";


            collapseButton.title =
                controlsCollapsed
                    ? "Show controls"
                    : "Hide controls";
        }


        /*
        ============================================================
        Browser support
        ============================================================
        */

        function checkSupport() {

            if (!window.isSecureContext) {

                throw new Error(
                    "This page must be opened over HTTPS."
                );
            }


            if (
                !navigator.mediaDevices ||
                !navigator.mediaDevices.getUserMedia ||
                !navigator.mediaDevices.enumerateDevices
            ) {

                throw new Error(
                    "This browser does not support camera capture."
                );
            }
        }


        /*
        ============================================================
        Device scoring
        ============================================================
        */

        function getDeviceScore(
            device
        ) {

            const label =
                (device.label || "")
                    .toLowerCase();


            let score =
                0;


            for (
                let i = 0;
                i < preferredDeviceWords.length;
                i++
            ) {

                if (
                    label.includes(
                        preferredDeviceWords[i]
                    )
                ) {

                    score +=
                        100 - i;
                }
            }


            if (
                label.includes("integrated") ||
                label.includes("facetime") ||
                label.includes("front camera") ||
                label.includes("webcam")
            ) {

                score -=
                    50;
            }


            return score;
        }


        /*
        ============================================================
        Permission
        ============================================================
        */

        async function requestPermission() {

            if (permissionGranted) {
                return;
            }


            setMessage(
                "Requesting camera permission..."
            );


            const temporaryStream =
                await navigator.mediaDevices
                    .getUserMedia({
                        video: true,
                        audio: false
                    });


            temporaryStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );


            permissionGranted =
                true;
        }


        /*
        ============================================================
        Enumerate devices
        ============================================================
        */

        async function refreshDevices(
            requestCameraPermission = false
        ) {

            checkSupport();


            const previousSelection =
                deviceSelect.value;


            const savedSelection =
                localStorage.getItem(
                    SAVED_DEVICE_KEY
                );


            if (
                requestCameraPermission
            ) {

                await requestPermission();
            }


            const devices =
                await navigator.mediaDevices
                    .enumerateDevices();


            const videoDevices =
                devices.filter(
                    device =>
                        device.kind ===
                        "videoinput"
                );


            deviceSelect.innerHTML =
                "";


            if (
                videoDevices.length === 0
            ) {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    "";


                option.textContent =
                    "No video devices found";


                deviceSelect.appendChild(
                    option
                );


                startButton.disabled =
                    true;


                setMessage(
                    "No video capture devices were found.",
                    "error"
                );


                return;
            }


            startButton.disabled =
                false;


            videoDevices.forEach(
                (device, index) => {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        device.deviceId;


                    option.textContent =
                        device.label ||
                        `Camera ${index + 1}`;


                    deviceSelect.appendChild(
                        option
                    );
                }
            );


            let selectedDevice =
                videoDevices.find(
                    device =>
                        device.deviceId ===
                        previousSelection
                );


            if (
                !selectedDevice
            ) {

                selectedDevice =
                    videoDevices.find(
                        device =>
                            device.deviceId ===
                            savedSelection
                    );
            }


            if (
                !selectedDevice
            ) {

                selectedDevice =
                    [...videoDevices]
                        .sort(
                            (a, b) =>
                                getDeviceScore(b) -
                                getDeviceScore(a)
                        )[0];
            }


            if (
                selectedDevice
            ) {

                deviceSelect.value =
                    selectedDevice.deviceId;
            }
        }


        /*
        ============================================================
        Rotation
        ============================================================
        */

        function normalizeRotation() {

            rotation =
                ((rotation % 360) + 360) %
                360;
        }


        /*
        ============================================================
        Reset active frame
        ============================================================
        */

        function resetActiveRect() {

            activeRect = {

                x: 0,

                y: 0,

                width:
                    sourceVideo.videoWidth,

                height:
                    sourceVideo.videoHeight
            };


            updateOutputGeometry();
        }


        /*
        ============================================================
        Black-column detection
        ============================================================
        */

        function isBlackColumn(
            imageData,
            width,
            height,
            x
        ) {

            let darkPixels =
                0;

            let pixelCount =
                0;


            for (
                let y = 0;
                y < height;
                y += 2
            ) {

                const index =
                    (
                        y * width +
                        x
                    ) * 4;


                const r =
                    imageData[index];

                const g =
                    imageData[index + 1];

                const b =
                    imageData[index + 2];


                if (
                    r <= BLACK_THRESHOLD &&
                    g <= BLACK_THRESHOLD &&
                    b <= BLACK_THRESHOLD
                ) {

                    darkPixels++;
                }


                pixelCount++;
            }


            return (
                darkPixels /
                pixelCount
            ) >= BLACK_COLUMN_RATIO;
        }


        /*
        ============================================================
        Detect uniform HDMI sidebars
        ============================================================
        */

        function detectActiveRect() {

            const videoWidth =
                sourceVideo.videoWidth;


            const videoHeight =
                sourceVideo.videoHeight;


            if (
                !videoWidth ||
                !videoHeight
            ) {

                return;
            }


            const detectWidth =
                DETECTION_WIDTH;


            const detectHeight =
                Math.max(
                    1,
                    Math.round(
                        detectWidth *
                        videoHeight /
                        videoWidth
                    )
                );


            detectionCanvas.width =
                detectWidth;


            detectionCanvas.height =
                detectHeight;


            detectionContext.drawImage(
                sourceVideo,
                0,
                0,
                detectWidth,
                detectHeight
            );


            const pixels =
                detectionContext
                    .getImageData(
                        0,
                        0,
                        detectWidth,
                        detectHeight
                    )
                    .data;


            let left =
                0;


            let right =
                detectWidth - 1;


            while (
                left < right &&
                isBlackColumn(
                    pixels,
                    detectWidth,
                    detectHeight,
                    left
                )
            ) {

                left++;
            }


            while (
                right > left &&
                isBlackColumn(
                    pixels,
                    detectWidth,
                    detectHeight,
                    right
                )
            ) {

                right--;
            }


            /*
            Add one detection pixel of safety back onto
            each side.

            At 1920 input with a 320px detection image,
            this is about 6 source pixels per side.
            */

            left =
                Math.max(
                    0,
                    left - 1
                );


            right =
                Math.min(
                    detectWidth - 1,
                    right + 1
                );


            const detectedWidth =
                right -
                left +
                1;


            /*
            Reject implausibly narrow detections.
            */

            if (
                detectedWidth <
                detectWidth * 0.35
            ) {

                return;
            }


            const sourceLeft =
                Math.floor(
                    left /
                    detectWidth *
                    videoWidth
                );


            const sourceRight =
                Math.ceil(
                    (
                        right + 1
                    ) /
                    detectWidth *
                    videoWidth
                );


            const newRect = {

                x:
                    sourceLeft,

                y:
                    0,

                width:
                    sourceRight -
                    sourceLeft,

                height:
                    videoHeight
            };


            const changed =
                Math.abs(
                    newRect.x -
                    activeRect.x
                ) > 3 ||

                Math.abs(
                    newRect.width -
                    activeRect.width
                ) > 6 ||

                newRect.height !==
                    activeRect.height;


            if (
                changed
            ) {

                activeRect =
                    newRect;


                updateOutputGeometry();
            }
        }


        /*
        ============================================================
        Canvas resolution
        ============================================================
        */

        function updateOutputGeometry() {

            normalizeRotation();


            if (
                !activeRect.width ||
                !activeRect.height
            ) {

                return;
            }


            const quarterTurn =
                rotation === 90 ||
                rotation === 270;


            const outputWidth =
                quarterTurn
                    ? activeRect.height
                    : activeRect.width;


            const outputHeight =
                quarterTurn
                    ? activeRect.width
                    : activeRect.height;


            if (
                outputCanvas.width !==
                outputWidth
            ) {

                outputCanvas.width =
                    outputWidth;
            }


            if (
                outputCanvas.height !==
                outputHeight
            ) {

                outputCanvas.height =
                    outputHeight;
            }


            updateCanvasDisplaySize();

            updateDiagnostics();
        }


        /*
        ============================================================
        Maximize canvas in browser

        The complete detected image is ALWAYS visible.

        Scaling UP is allowed.
        Scaling DOWN is allowed.

        Whichever browser dimension becomes limiting determines
        the final size.
        ============================================================
        */

        function updateCanvasDisplaySize() {

            if (
                !outputCanvas.width ||
                !outputCanvas.height
            ) {

                return;
            }


            const availableWidth =
                stage.clientWidth;


            const availableHeight =
                stage.clientHeight;


            if (
                !availableWidth ||
                !availableHeight
            ) {

                return;
            }


            const scale =
                Math.min(
                    availableWidth /
                        outputCanvas.width,

                    availableHeight /
                        outputCanvas.height
                );


            outputCanvas.style.width =
                `${
                    outputCanvas.width *
                    scale
                }px`;


            outputCanvas.style.height =
                `${
                    outputCanvas.height *
                    scale
                }px`;
        }


        /*
        ============================================================
        Draw current frame
        ============================================================
        */

        function drawOutputFrame() {

            if (
                sourceVideo.readyState <
                HTMLMediaElement.HAVE_CURRENT_DATA
            ) {

                return;
            }


            const sx =
                activeRect.x;


            const sy =
                activeRect.y;


            const sw =
                activeRect.width;


            const sh =
                activeRect.height;


            const cw =
                outputCanvas.width;


            const ch =
                outputCanvas.height;


            outputContext.save();


            outputContext.setTransform(
                1,
                0,
                0,
                1,
                0,
                0
            );


            outputContext.fillStyle =
                "#000";


            outputContext.fillRect(
                0,
                0,
                cw,
                ch
            );


            switch (
                rotation
            ) {

                case 90:

                    outputContext.translate(
                        cw,
                        0
                    );


                    outputContext.rotate(
                        Math.PI / 2
                    );

                    break;


                case 180:

                    outputContext.translate(
                        cw,
                        ch
                    );


                    outputContext.rotate(
                        Math.PI
                    );

                    break;


                case 270:

                    outputContext.translate(
                        0,
                        ch
                    );


                    outputContext.rotate(
                        -Math.PI / 2
                    );

                    break;
            }


            outputContext.drawImage(
                sourceVideo,

                sx,
                sy,
                sw,
                sh,

                0,
                0,
                sw,
                sh
            );


            outputContext.restore();
        }


        /*
        ============================================================
        Rendering loop
        ============================================================
        */

        function renderFrame(
            timestamp
        ) {

            if (
                !rendering
            ) {

                return;
            }


            if (
                timestamp -
                    lastDetectionTime >=
                DETECTION_INTERVAL
            ) {

                lastDetectionTime =
                    timestamp;


                detectActiveRect();
            }


            drawOutputFrame();


            requestAnimationFrame(
                renderFrame
            );
        }


        function startRendering() {

            if (
                rendering
            ) {

                return;
            }


            rendering =
                true;


            lastDetectionTime =
                0;


            requestAnimationFrame(
                renderFrame
            );
        }


        function stopRendering() {

            rendering =
                false;
        }


        /*
        ============================================================
        Diagnostics
        ============================================================
        */

        function updateDiagnostics() {

            if (
                !stream
            ) {

                diagnostics.textContent =
                    "No active video";

                return;
            }


            const track =
                stream
                    .getVideoTracks()[0];


            const inputWidth =
                sourceVideo.videoWidth ||
                "?";


            const inputHeight =
                sourceVideo.videoHeight ||
                "?";


            const outputWidth =
                outputCanvas.width ||
                "?";


            const outputHeight =
                outputCanvas.height ||
                "?";


            diagnostics.textContent =
                `${track.label || "Video Capture"} ` +
                `• Input ${inputWidth}×${inputHeight} ` +
                `• View ${outputWidth}×${outputHeight}`;
        }


        /*
        ============================================================
        Stop capture
        ============================================================
        */

        function stopCapture(
            updateMessage = true
        ) {

            stopRendering();


            if (
                stream
            ) {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );
            }


            stream =
                null;


            sourceVideo.srcObject =
                null;


            outputContext.clearRect(
                0,
                0,
                outputCanvas.width,
                outputCanvas.height
            );


            startup.style.display =
                "flex";


            startButton.disabled =
                false;


            stopButton.disabled =
                true;


            diagnostics.textContent =
                "No active video";


            if (
                updateMessage
            ) {

                setMessage(
                    "Capture stopped."
                );
            }
        }


        /*
        ============================================================
        Start capture
        ============================================================
        */

        async function startCapture() {

            try {

                checkSupport();


                startButton.disabled =
                    true;


                setMessage(
                    "Preparing video devices..."
                );


                await refreshDevices(
                    true
                );


                const deviceId =
                    deviceSelect.value;


                if (
                    !deviceId
                ) {

                    throw new Error(
                        "No video device is selected."
                    );
                }


                stopCapture(
                    false
                );


                setMessage(
                    "Starting capture..."
                );


                const constraints = {

                    audio:
                        false,

                    video: {

                        deviceId: {
                            exact:
                                deviceId
                        },

                        width: {
                            ideal:
                                1920
                        },

                        height: {
                            ideal:
                                1080
                        },

                        frameRate: {
                            ideal:
                                60,

                            max:
                                60
                        }
                    }
                };


                try {

                    stream =
                        await navigator.mediaDevices
                            .getUserMedia(
                                constraints
                            );

                } catch (
                    error
                ) {

                    console.warn(
                        "Preferred mode failed. Retrying with device defaults.",
                        error
                    );


                    stream =
                        await navigator.mediaDevices
                            .getUserMedia({

                                audio:
                                    false,

                                video: {

                                    deviceId: {
                                        exact:
                                            deviceId
                                    }
                                }
                            });
                }


                sourceVideo.srcObject =
                    stream;


                await sourceVideo.play();


                resetActiveRect();


                detectActiveRect();


                startRendering();


                startup.style.display =
                    "none";


                startButton.disabled =
                    true;


                stopButton.disabled =
                    false;


                localStorage.setItem(
                    SAVED_DEVICE_KEY,
                    deviceId
                );


                updateDiagnostics();


                setMessage(
                    "Wired capture is live.",
                    "live"
                );


                const track =
                    stream
                        .getVideoTracks()[0];


                track.addEventListener(
                    "ended",
                    () => {

                        stopCapture(
                            false
                        );


                        setMessage(
                            "Capture device disconnected.",
                            "error"
                        );
                    }
                );

            } catch (
                error
            ) {

                console.error(
                    error
                );


                startButton.disabled =
                    false;


                stopButton.disabled =
                    true;


                showCaptureError(
                    error
                );
            }
        }


        /*
        ============================================================
        Errors
        ============================================================
        */

        function showCaptureError(
            error
        ) {

            let text =
                error.message ||
                String(error);


            switch (
                error.name
            ) {

                case "NotAllowedError":

                    text =
                        "Camera access was denied. Allow camera access for this site.";

                    break;


                case "NotFoundError":

                    text =
                        "No compatible video capture device was found.";

                    break;


                case "NotReadableError":

                    text =
                        "Windows found the capture device but could not open it.";

                    break;


                case "SecurityError":

                    text =
                        "The browser or computer security policy blocked camera access.";

                    break;
            }


            setMessage(
                text,
                "error"
            );
        }


        /*
        ============================================================
        Rotation
        ============================================================
        */

        function rotateLeft() {

            rotation -=
                90;


            normalizeRotation();


            updateOutputGeometry();
        }


        function rotateRight() {

            rotation +=
                90;


            normalizeRotation();


            updateOutputGeometry();
        }


        /*
        ============================================================
        Fullscreen
        ============================================================
        */

        async function toggleFullscreen() {

            try {

                if (
                    !document.fullscreenElement
                ) {

                    await document
                        .documentElement
                        .requestFullscreen();

                } else {

                    await document
                        .exitFullscreen();
                }

            } catch (
                error
            ) {

                console.error(
                    error
                );


                setMessage(
                    "Fullscreen mode was blocked by the browser.",
                    "error"
                );
            }
        }


        /*
        ============================================================
        Events
        ============================================================
        */

        collapseButton.addEventListener(
            "click",
            toggleControls
        );


        refreshButton.addEventListener(
            "click",
            async () => {

                try {

                    await refreshDevices(
                        true
                    );

                } catch (
                    error
                ) {

                    showCaptureError(
                        error
                    );
                }
            }
        );


        startButton.addEventListener(
            "click",
            startCapture
        );


        stopButton.addEventListener(
            "click",
            () =>
                stopCapture(
                    true
                )
        );


        rotateLeftButton.addEventListener(
            "click",
            rotateLeft
        );


        rotateRightButton.addEventListener(
            "click",
            rotateRight
        );


        fullscreenButton.addEventListener(
            "click",
            toggleFullscreen
        );


        deviceSelect.addEventListener(
            "change",
            () => {

                if (
                    deviceSelect.value
                ) {

                    localStorage.setItem(
                        SAVED_DEVICE_KEY,
                        deviceSelect.value
                    );
                }
            }
        );


        /*
        Re-maximize whenever the browser window changes size.
        */

        window.addEventListener(
            "resize",
            updateCanvasDisplaySize
        );


        document.addEventListener(
            "fullscreenchange",
            () => {

                requestAnimationFrame(
                    updateCanvasDisplaySize
                );
            }
        );


        /*
        Re-evaluate geometry if the source stream itself
        changes dimensions.
        */

        sourceVideo.addEventListener(
            "resize",
            () => {

                resetActiveRect();

                detectActiveRect();
            }
        );


        /*
        Detect capture-device connection changes.
        */

        if (
            navigator.mediaDevices &&
            "addEventListener" in
                navigator.mediaDevices
        ) {

            navigator.mediaDevices
                .addEventListener(
                    "devicechange",
                    async () => {

                        try {

                            await refreshDevices(
                                false
                            );

                        } catch (
                            error
                        ) {

                            console.error(
                                error
                            );
                        }
                    }
                );
        }


        /*
        ============================================================
        Initialize
        ============================================================
        */

        async function initialize() {

            try {

                checkSupport();


                await refreshDevices(
                    false
                );


                setMessage(
                    "Connect the capture card and click Start Capture."
                );

            } catch (
                error
            ) {

                startButton.disabled =
                    true;


                refreshButton.disabled =
                    true;


                showCaptureError(
                    error
                );
            }
        }


        initialize();

    </script>

</body>
</html>
