<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>iPadMirror - Wired</title>

    <style>
        :root {
            color-scheme: dark;
            --viewer-background: #000000;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;

            margin: 0;
            overflow: hidden;

            background: var(--viewer-background);
            color: #fff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }


        /*
        ============================================================
        Viewer
        ============================================================
        */

        #stage {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background: var(--viewer-background);
        }


        #sourceVideo {
            position: fixed;

            left: -10000px;
            top: -10000px;

            width: 1px;
            height: 1px;

            opacity: 0;

            pointer-events: none;
        }


        #outputCanvas {
            display: block;

            margin: 0;
            padding: 0;

            background: var(--viewer-background);
        }


        /*
        ============================================================
        Controls
        ============================================================
        */

        #controls {
            position: fixed;

            top: 50%;
            left: 8px;

            transform: translateY(-50%);

            z-index: 10;

            display: flex;
            flex-direction: column;
            align-items: stretch;

            gap: 8px;

            width: 280px;

            max-height: calc(100vh - 16px);

            padding: 10px;

            overflow-y: auto;

            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 12px;

            background: rgba(20, 20, 20, 0.90);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }


        #controls.collapsed {
            width: auto;
            min-width: 0;

            max-height: none;

            padding: 4px;

            overflow: visible;

            transform: none;
        }


        #controls.collapsed > *:not(#collapseButton) {
            display: none;
        }


        /*
        ============================================================
        General controls
        ============================================================
        */

        select,
        button {
            min-height: 38px;

            padding: 7px 12px;

            border: 1px solid #555;
            border-radius: 7px;

            background: #262626;
            color: #fff;

            font-size: 14px;
        }


        button {
            cursor: pointer;
        }


        button:hover {
            background: #383838;
        }


        button:disabled {
            opacity: 0.45;
            cursor: default;
        }


        #controls select,
        #controls button:not(#collapseButton) {
            width: 100%;
        }


        #controls select {
            min-width: 0;
            max-width: none;
        }


        /*
        The arrow is intentionally much narrower than the menu.
        It is also the vertical drag handle.
        */

        #controls #collapseButton {
            align-self: flex-start;

            width: 28px;
            min-width: 28px;
            height: 38px;
            min-height: 38px;

            padding: 0;

            font-size: 16px;
            line-height: 1;

            cursor: ns-resize;

            touch-action: none;

            user-select: none;
            -webkit-user-select: none;
        }


        #controls.collapsed #collapseButton {
            width: 28px;
            min-width: 28px;

            margin: 0;
        }


        #startButton {
            background: #176b36;
            border-color: #26884c;
        }


        #startButton:hover {
            background: #1d8142;
        }


        #stopButton {
            background: #702828;
            border-color: #8a3434;
        }


        #stopButton:hover {
            background: #853030;
        }


        /*
        ============================================================
        Background selector
        ============================================================
        */

        #backgroundControl {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 7px;

            width: 100%;
            min-height: 38px;

            padding: 4px 8px;

            border: 1px solid #555;
            border-radius: 7px;

            background: #262626;

            color: #ddd;

            font-size: 13px;
        }


        #backgroundColorPicker {
            width: 36px;
            height: 28px;

            margin: 0;
            padding: 0;

            border: 0;

            background: transparent;

            cursor: pointer;
        }


        #backgroundColorPicker::-webkit-color-swatch-wrapper {
            padding: 2px;
        }


        #backgroundColorPicker::-webkit-color-swatch {
            border: 1px solid #777;
            border-radius: 5px;
        }


        /*
        ============================================================
        Diagnostics
        ============================================================
        */

        #diagnostics {
            width: 100%;

            margin: 4px 0 0 0;

            color: #aaa;

            font-size: 12px;
            line-height: 1.4;

            white-space: normal;
            overflow-wrap: anywhere;

            text-align: center;
        }


        /*
        ============================================================
        Status message
        ============================================================
        */

        #message {
            position: fixed;

            left: 50%;
            bottom: 18px;

            transform: translateX(-50%);

            z-index: 10;

            max-width: calc(100vw - 30px);

            padding: 8px 14px;

            border-radius: 8px;

            background: rgba(20, 20, 20, 0.85);

            color: #ddd;

            font-size: 13px;
            text-align: center;

            pointer-events: none;

            transition:
                opacity 0.2s ease,
                visibility 0.2s ease;
        }


        #message.collapsed {
            opacity: 0;
            visibility: hidden;
        }


        #message.live {
            color: #8ee6a8;
        }


        #message.error {
            color: #ff9696;
        }


        /*
        ============================================================
        Startup
        ============================================================
        */

        #startup {
            position: fixed;
            inset: 0;

            z-index: 5;

            display: flex;
            align-items: center;
            justify-content: center;

            pointer-events: none;
        }


        #startupContent {
            padding: 30px;

            color: #aaa;
            text-align: center;
        }


        #startupContent h1 {
            margin: 0 0 8px 0;

            color: #fff;

            font-size: 32px;
            font-weight: 500;
        }


        #startupContent p {
            margin: 0;

            font-size: 15px;
        }


        /*
        ============================================================
        Narrow browser windows
        ============================================================
        */

        @media (max-width: 500px) {

            #controls:not(.collapsed) {
                width: min(
                    260px,
                    calc(100vw - 16px)
                );
            }
        }
    </style>
</head>


<body>

    <div id="stage">

        <video
            id="sourceVideo"
            autoplay
            playsinline
            muted
        ></video>


        <canvas
            id="outputCanvas"
        ></canvas>

    </div>


    <div id="startup">

        <div id="startupContent">

            <h1>
                iPadMirror
            </h1>

            <p>
                Connect the UVC capture device and click Start Capture.
            </p>

        </div>

    </div>


    <div id="controls">

        <button
            id="collapseButton"
            type="button"
            title="Click to hide controls. Drag up or down to move."
        >
            ◀
        </button>


        <select
            id="deviceSelect"
            aria-label="Video capture device"
        >
            <option value="">
                Loading video devices...
            </option>
        </select>


        <button
            id="refreshButton"
            type="button"
        >
            Refresh
        </button>


        <button
            id="startButton"
            type="button"
        >
            Start Capture
        </button>


        <button
            id="stopButton"
            type="button"
            disabled
        >
            Stop
        </button>


        <button
            id="rotateLeftButton"
            type="button"
            title="Rotate counterclockwise"
        >
            ↺ Rotate 90°
        </button>


        <button
            id="rotateRightButton"
            type="button"
            title="Rotate clockwise"
        >
            ↻ Rotate 90°
        </button>


        <label
            id="backgroundControl"
            title="Viewer background color"
        >

            <span>
                Background
            </span>

            <input
                id="backgroundColorPicker"
                type="color"
                value="#000000"
            >

        </label>


        <button
            id="resetBackgroundButton"
            type="button"
        >
            Reset Background
        </button>


        <button
            id="fullscreenButton"
            type="button"
        >
            Fullscreen
        </button>


        <div id="diagnostics">
            No active video
        </div>

    </div>


    <div id="message">
        Waiting for capture device.
    </div>


    <script>
        "use strict";


        /*
        ============================================================
        Elements
        ============================================================
        */

        const stage =
            document.getElementById(
                "stage"
            );


        const sourceVideo =
            document.getElementById(
                "sourceVideo"
            );


        const outputCanvas =
            document.getElementById(
                "outputCanvas"
            );


        const outputContext =
            outputCanvas.getContext(
                "2d",
                {
                    alpha: false
                }
            );


        const controls =
            document.getElementById(
                "controls"
            );


        const collapseButton =
            document.getElementById(
                "collapseButton"
            );


        const deviceSelect =
            document.getElementById(
                "deviceSelect"
            );


        const refreshButton =
            document.getElementById(
                "refreshButton"
            );


        const startButton =
            document.getElementById(
                "startButton"
            );


        const stopButton =
            document.getElementById(
                "stopButton"
            );


        const rotateLeftButton =
            document.getElementById(
                "rotateLeftButton"
            );


        const rotateRightButton =
            document.getElementById(
                "rotateRightButton"
            );


        const backgroundColorPicker =
            document.getElementById(
                "backgroundColorPicker"
            );


        const resetBackgroundButton =
            document.getElementById(
                "resetBackgroundButton"
            );


        const fullscreenButton =
            document.getElementById(
                "fullscreenButton"
            );


        const diagnostics =
            document.getElementById(
                "diagnostics"
            );


        const message =
            document.getElementById(
                "message"
            );


        const startup =
            document.getElementById(
                "startup"
            );


        /*
        ============================================================
        Detection canvas
        ============================================================
        */

        const detectionCanvas =
            document.createElement(
                "canvas"
            );


        const detectionContext =
            detectionCanvas.getContext(
                "2d",
                {
                    willReadFrequently: true
                }
            );


        /*
        ============================================================
        Saved settings
        ============================================================
        */

        const SAVED_DEVICE_KEY =
            "iPadMirrorUVCDevice";


        const SAVED_BACKGROUND_KEY =
            "iPadMirrorBackgroundColor";


        const SAVED_TOOLBAR_POSITION_KEY =
            "iPadMirrorToolbarPosition";


        /*
        ============================================================
        Border detection settings
        ============================================================
        */

        const DETECTION_WIDTH =
            320;


        const DETECTION_INTERVAL =
            500;


        const BLACK_THRESHOLD =
            24;


        const BLACK_EDGE_RATIO =
            0.99;


        /*
        ============================================================
        Toolbar settings
        ============================================================
        */

        const TOOLBAR_EDGE_MARGIN =
            8;


        const DRAG_THRESHOLD =
            4;


        /*
        ============================================================
        State
        ============================================================
        */

        let stream =
            null;


        let rotation =
            0;


        let permissionGranted =
            false;


        let controlsCollapsed =
            false;


        let rendering =
            false;


        let lastDetectionTime =
            0;


        let viewerBackground =
            "#000000";


        /*
        Desired vertical center of the collapse/expand arrow
        measured in browser viewport pixels.
        */

        let toolbarButtonCenterY =
            null;


        let toolbarDragging =
            false;


        let toolbarDragStartY =
            0;


        let toolbarDragStartCenterY =
            0;


        let suppressToolbarClick =
            false;


        let toolbarPointerId =
            null;


        let activeRect = {

            x:
                0,

            y:
                0,

            width:
                0,

            height:
                0
        };


        const preferredDeviceWords = [

            "clariview",
            "capture",
            "usb video",
            "uvc",
            "hdmi",
            "cam link",
            "avermedia",
            "magewell",
            "video capture"

        ];


        /*
        ============================================================
        Background color
        ============================================================
        */

        function applyBackgroundColor(
            color,
            save = true
        ) {

            viewerBackground =
                color;


            document.documentElement
                .style
                .setProperty(
                    "--viewer-background",
                    color
                );


            backgroundColorPicker.value =
                color;


            if (
                save
            ) {

                localStorage.setItem(
                    SAVED_BACKGROUND_KEY,
                    color
                );
            }
        }


        function loadBackgroundColor() {

            const savedColor =
                localStorage.getItem(
                    SAVED_BACKGROUND_KEY
                );


            if (
                savedColor
            ) {

                applyBackgroundColor(
                    savedColor,
                    false
                );

            } else {

                applyBackgroundColor(
                    "#000000",
                    false
                );
            }
        }


        function resetBackgroundColor() {

            applyBackgroundColor(
                "#000000",
                true
            );
        }


        /*
        ============================================================
        Status
        ============================================================
        */

        function setMessage(
            text,
            type = ""
        ) {

            message.textContent =
                text;


            message.classList.remove(
                "live",
                "error"
            );


            if (
                type
            ) {

                message.classList.add(
                    type
                );
            }
        }


        /*
        ============================================================
        Toolbar position
        ============================================================
        */

        function saveToolbarPosition() {

            if (
                toolbarButtonCenterY ===
                null
            ) {

                return;
            }


            const ratio =
                toolbarButtonCenterY /
                window.innerHeight;


            localStorage.setItem(
                SAVED_TOOLBAR_POSITION_KEY,
                String(ratio)
            );
        }


        function loadToolbarPosition() {

            const saved =
                parseFloat(
                    localStorage.getItem(
                        SAVED_TOOLBAR_POSITION_KEY
                    )
                );


            if (
                Number.isFinite(saved) &&
                saved >= 0 &&
                saved <= 1
            ) {

                toolbarButtonCenterY =
                    saved *
                    window.innerHeight;


                positionControls();

                return;
            }


            /*
            No saved position.

            Use the arrow's current position from the initial
            centered-menu layout.
            */

            const rect =
                collapseButton
                    .getBoundingClientRect();


            toolbarButtonCenterY =
                rect.top +
                rect.height / 2;


            positionControls();
        }


        function positionControls() {

            if (
                toolbarButtonCenterY ===
                null
            ) {

                return;
            }


            /*
            Clamp the arrow itself to the viewport.
            */

            const buttonHeight =
                collapseButton.offsetHeight;


            const halfButton =
                buttonHeight / 2;


            toolbarButtonCenterY =
                Math.max(
                    TOOLBAR_EDGE_MARGIN +
                        halfButton,

                    Math.min(
                        window.innerHeight -
                            TOOLBAR_EDGE_MARGIN -
                            halfButton,

                        toolbarButtonCenterY
                    )
                );


            /*
            offsetTop tells us where the arrow begins inside
            the current expanded/collapsed toolbar.
            */

            const buttonOffsetTop =
                collapseButton.offsetTop;


            let desiredControlsTop =
                toolbarButtonCenterY -
                buttonOffsetTop -
                halfButton;


            /*
            Keep the complete menu inside the browser whenever
            its height allows it.
            */

            const controlsHeight =
                controls.offsetHeight;


            const maximumTop =
                window.innerHeight -
                controlsHeight -
                TOOLBAR_EDGE_MARGIN;


            if (
                maximumTop >=
                TOOLBAR_EDGE_MARGIN
            ) {

                desiredControlsTop =
                    Math.max(
                        TOOLBAR_EDGE_MARGIN,

                        Math.min(
                            maximumTop,
                            desiredControlsTop
                        )
                    );

            } else {

                desiredControlsTop =
                    TOOLBAR_EDGE_MARGIN;
            }


            controls.style.top =
                `${desiredControlsTop}px`;


            controls.style.bottom =
                "auto";


            controls.style.transform =
                "none";
        }


        /*
        Read the arrow's actual location after browser clamping.

        This prevents a jump when switching between collapsed
        and expanded states near the top or bottom of the screen.
        */

        function syncToolbarPositionFromActualButton() {

            const rect =
                collapseButton
                    .getBoundingClientRect();


            toolbarButtonCenterY =
                rect.top +
                rect.height / 2;
        }


        /*
        ============================================================
        Collapse / expand controls
        ============================================================
        */

        function setControlsCollapsed(
            collapsed
        ) {

            if (
                collapsed ===
                controlsCollapsed
            ) {

                return;
            }


            /*
            Preserve the current arrow location.
            */

            syncToolbarPositionFromActualButton();


            controls.classList.toggle(
                "collapsed",
                collapsed
            );


            message.classList.toggle(
                "collapsed",
                collapsed
            );


            controlsCollapsed =
                collapsed;


            collapseButton.textContent =
                collapsed
                    ? "▶"
                    : "◀";


            collapseButton.title =
                collapsed
                    ? "Click to show controls. Drag up or down to move."
                    : "Click to hide controls. Drag up or down to move.";


            /*
            Re-position after the toolbar dimensions have changed.
            */

            positionControls();


            /*
            Store the real resulting arrow position so toggling
            again does not cause a jump.
            */

            syncToolbarPositionFromActualButton();

            saveToolbarPosition();
        }


        function toggleControls() {

            setControlsCollapsed(
                !controlsCollapsed
            );
        }


        /*
        ============================================================
        Toolbar dragging

        Pointer Events support mouse, pen, and touch.

        A short press remains a normal click.
        Moving more than DRAG_THRESHOLD pixels becomes a drag.
        ============================================================
        */

        collapseButton.addEventListener(
            "pointerdown",
            event => {

                if (
                    event.button !== undefined &&
                    event.button !== 0
                ) {

                    return;
                }


                syncToolbarPositionFromActualButton();


                toolbarPointerId =
                    event.pointerId;


                toolbarDragStartY =
                    event.clientY;


                toolbarDragStartCenterY =
                    toolbarButtonCenterY;


                toolbarDragging =
                    false;


                suppressToolbarClick =
                    false;


                collapseButton.setPointerCapture(
                    event.pointerId
                );
            }
        );


        collapseButton.addEventListener(
            "pointermove",
            event => {

                if (
                    toolbarPointerId !==
                    event.pointerId
                ) {

                    return;
                }


                const deltaY =
                    event.clientY -
                    toolbarDragStartY;


                if (
                    !toolbarDragging &&
                    Math.abs(deltaY) >=
                        DRAG_THRESHOLD
                ) {

                    toolbarDragging =
                        true;
                }


                if (
                    !toolbarDragging
                ) {

                    return;
                }


                event.preventDefault();


                toolbarButtonCenterY =
                    toolbarDragStartCenterY +
                    deltaY;


                positionControls();


                /*
                The expanded menu may reach a viewport boundary.
                Keep our saved anchor synchronized with wherever
                the arrow actually ended up.
                */

                syncToolbarPositionFromActualButton();
            }
        );


        function finishToolbarDrag(
            event
        ) {

            if (
                toolbarPointerId !==
                event.pointerId
            ) {

                return;
            }


            if (
                toolbarDragging
            ) {

                suppressToolbarClick =
                    true;


                syncToolbarPositionFromActualButton();

                saveToolbarPosition();
            }


            try {

                collapseButton.releasePointerCapture(
                    event.pointerId
                );

            } catch (
                error
            ) {

                /*
                Pointer capture may already have been released.
                No action required.
                */
            }


            toolbarPointerId =
                null;


            toolbarDragging =
                false;
        }


        collapseButton.addEventListener(
            "pointerup",
            finishToolbarDrag
        );


        collapseButton.addEventListener(
            "pointercancel",
            finishToolbarDrag
        );


        collapseButton.addEventListener(
            "click",
            event => {

                if (
                    suppressToolbarClick
                ) {

                    suppressToolbarClick =
                        false;


                    event.preventDefault();

                    event.stopPropagation();

                    return;
                }


                toggleControls();
            }
        );


        /*
        ============================================================
        Browser support
        ============================================================
        */

        function checkSupport() {

            if (
                !window.isSecureContext
            ) {

                throw new Error(
                    "This page must be opened over HTTPS."
                );
            }


            if (
                !navigator.mediaDevices ||
                !navigator.mediaDevices.getUserMedia ||
                !navigator.mediaDevices.enumerateDevices
            ) {

                throw new Error(
                    "This browser does not support camera capture."
                );
            }
        }


        /*
        ============================================================
        Device scoring
        ============================================================
        */

        function getDeviceScore(
            device
        ) {

            const label =
                (
                    device.label ||
                    ""
                ).toLowerCase();


            let score =
                0;


            for (
                let i = 0;
                i < preferredDeviceWords.length;
                i++
            ) {

                if (
                    label.includes(
                        preferredDeviceWords[i]
                    )
                ) {

                    score +=
                        100 - i;
                }
            }


            if (
                label.includes("integrated") ||
                label.includes("facetime") ||
                label.includes("front camera") ||
                label.includes("webcam")
            ) {

                score -=
                    50;
            }


            return score;
        }


        /*
        ============================================================
        Camera permission
        ============================================================
        */

        async function requestPermission() {

            if (
                permissionGranted
            ) {

                return;
            }


            setMessage(
                "Requesting camera permission..."
            );


            const temporaryStream =
                await navigator.mediaDevices
                    .getUserMedia({

                        video:
                            true,

                        audio:
                            false
                    });


            temporaryStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );


            permissionGranted =
                true;
        }


        /*
        ============================================================
        Device enumeration
        ============================================================
        */

        async function refreshDevices(
            requestCameraPermission = false
        ) {

            checkSupport();


            const previousSelection =
                deviceSelect.value;


            const savedSelection =
                localStorage.getItem(
                    SAVED_DEVICE_KEY
                );


            if (
                requestCameraPermission
            ) {

                await requestPermission();
            }


            const devices =
                await navigator.mediaDevices
                    .enumerateDevices();


            const videoDevices =
                devices.filter(
                    device =>
                        device.kind ===
                        "videoinput"
                );


            deviceSelect.innerHTML =
                "";


            if (
                videoDevices.length ===
                0
            ) {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    "";


                option.textContent =
                    "No video devices found";


                deviceSelect.appendChild(
                    option
                );


                startButton.disabled =
                    true;


                setMessage(
                    "No video capture devices were found.",
                    "error"
                );


                return;
            }


            startButton.disabled =
                false;


            videoDevices.forEach(
                (
                    device,
                    index
                ) => {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        device.deviceId;


                    option.textContent =
                        device.label ||
                        `Camera ${index + 1}`;


                    deviceSelect.appendChild(
                        option
                    );
                }
            );


            let selectedDevice =
                videoDevices.find(
                    device =>
                        device.deviceId ===
                        previousSelection
                );


            if (
                !selectedDevice
            ) {

                selectedDevice =
                    videoDevices.find(
                        device =>
                            device.deviceId ===
                            savedSelection
                    );
            }


            if (
                !selectedDevice
            ) {

                selectedDevice =
                    [...videoDevices]
                        .sort(
                            (
                                a,
                                b
                            ) =>
                                getDeviceScore(b) -
                                getDeviceScore(a)
                        )[0];
            }


            if (
                selectedDevice
            ) {

                deviceSelect.value =
                    selectedDevice.deviceId;
            }
        }


        /*
        ============================================================
        Rotation
        ============================================================
        */

        function normalizeRotation() {

            rotation =
                (
                    (
                        rotation %
                        360
                    ) +
                    360
                ) %
                360;
        }


        /*
        ============================================================
        Reset active rectangle
        ============================================================
        */

        function resetActiveRect() {

            activeRect = {

                x:
                    0,

                y:
                    0,

                width:
                    sourceVideo.videoWidth,

                height:
                    sourceVideo.videoHeight
            };


            updateOutputGeometry();
        }


        /*
        ============================================================
        Black column detection
        ============================================================
        */

        function isBlackColumn(
            imageData,
            width,
            height,
            x
        ) {

            let darkPixels =
                0;


            let pixelCount =
                0;


            for (
                let y = 0;
                y < height;
                y += 2
            ) {

                const index =
                    (
                        y *
                        width +
                        x
                    ) *
                    4;


                const r =
                    imageData[index];


                const g =
                    imageData[
                        index +
                        1
                    ];


                const b =
                    imageData[
                        index +
                        2
                    ];


                if (
                    r <= BLACK_THRESHOLD &&
                    g <= BLACK_THRESHOLD &&
                    b <= BLACK_THRESHOLD
                ) {

                    darkPixels++;
                }


                pixelCount++;
            }


            return (
                darkPixels /
                pixelCount
            ) >=
            BLACK_EDGE_RATIO;
        }


        /*
        ============================================================
        Black row detection
        ============================================================
        */

        function isBlackRow(
            imageData,
            width,
            height,
            y
        ) {

            let darkPixels =
                0;


            let pixelCount =
                0;


            for (
                let x = 0;
                x < width;
                x += 2
            ) {

                const index =
                    (
                        y *
                        width +
                        x
                    ) *
                    4;


                const r =
                    imageData[index];


                const g =
                    imageData[
                        index +
                        1
                    ];


                const b =
                    imageData[
                        index +
                        2
                    ];


                if (
                    r <= BLACK_THRESHOLD &&
                    g <= BLACK_THRESHOLD &&
                    b <= BLACK_THRESHOLD
                ) {

                    darkPixels++;
                }


                pixelCount++;
            }


            return (
                darkPixels /
                pixelCount
            ) >=
            BLACK_EDGE_RATIO;
        }


        /*
        ============================================================
        Detect active picture rectangle

        Removes uniform black HDMI borders from all four sides.
        ============================================================
        */

        function detectActiveRect() {

            const videoWidth =
                sourceVideo.videoWidth;


            const videoHeight =
                sourceVideo.videoHeight;


            if (
                !videoWidth ||
                !videoHeight
            ) {

                return;
            }


            const detectWidth =
                DETECTION_WIDTH;


            const detectHeight =
                Math.max(
                    1,
                    Math.round(
                        detectWidth *
                        videoHeight /
                        videoWidth
                    )
                );


            detectionCanvas.width =
                detectWidth;


            detectionCanvas.height =
                detectHeight;


            detectionContext.drawImage(
                sourceVideo,
                0,
                0,
                detectWidth,
                detectHeight
            );


            const pixels =
                detectionContext
                    .getImageData(
                        0,
                        0,
                        detectWidth,
                        detectHeight
                    )
                    .data;


            let left =
                0;


            let right =
                detectWidth -
                1;


            while (
                left <
                    right &&
                isBlackColumn(
                    pixels,
                    detectWidth,
                    detectHeight,
                    left
                )
            ) {

                left++;
            }


            while (
                right >
                    left &&
                isBlackColumn(
                    pixels,
                    detectWidth,
                    detectHeight,
                    right
                )
            ) {

                right--;
            }


            let top =
                0;


            let bottom =
                detectHeight -
                1;


            while (
                top <
                    bottom &&
                isBlackRow(
                    pixels,
                    detectWidth,
                    detectHeight,
                    top
                )
            ) {

                top++;
            }


            while (
                bottom >
                    top &&
                isBlackRow(
                    pixels,
                    detectWidth,
                    detectHeight,
                    bottom
                )
            ) {

                bottom--;
            }


            /*
            Put one detection pixel back on every side.
            At 1920x1080 with 320x180 detection this is
            approximately six source pixels.
            */

            left =
                Math.max(
                    0,
                    left - 1
                );


            right =
                Math.min(
                    detectWidth -
                        1,
                    right +
                        1
                );


            top =
                Math.max(
                    0,
                    top - 1
                );


            bottom =
                Math.min(
                    detectHeight -
                        1,
                    bottom +
                        1
                );


            const detectedWidth =
                right -
                left +
                1;


            const detectedHeight =
                bottom -
                top +
                1;


            if (
                detectedWidth <
                    detectWidth *
                        0.35 ||

                detectedHeight <
                    detectHeight *
                        0.35
            ) {

                return;
            }


            const sourceLeft =
                Math.floor(
                    left /
                    detectWidth *
                    videoWidth
                );


            const sourceRight =
                Math.ceil(
                    (
                        right +
                        1
                    ) /
                    detectWidth *
                    videoWidth
                );


            const sourceTop =
                Math.floor(
                    top /
                    detectHeight *
                    videoHeight
                );


            const sourceBottom =
                Math.ceil(
                    (
                        bottom +
                        1
                    ) /
                    detectHeight *
                    videoHeight
                );


            const newRect = {

                x:
                    sourceLeft,

                y:
                    sourceTop,

                width:
                    sourceRight -
                    sourceLeft,

                height:
                    sourceBottom -
                    sourceTop
            };


            const changed =

                Math.abs(
                    newRect.x -
                    activeRect.x
                ) >
                3 ||

                Math.abs(
                    newRect.y -
                    activeRect.y
                ) >
                3 ||

                Math.abs(
                    newRect.width -
                    activeRect.width
                ) >
                6 ||

                Math.abs(
                    newRect.height -
                    activeRect.height
                ) >
                6;


            if (
                changed
            ) {

                activeRect =
                    newRect;


                updateOutputGeometry();
            }
        }


        /*
        ============================================================
        Canvas output resolution
        ============================================================
        */

        function updateOutputGeometry() {

            normalizeRotation();


            if (
                !activeRect.width ||
                !activeRect.height
            ) {

                return;
            }


            const quarterTurn =

                rotation ===
                    90 ||

                rotation ===
                    270;


            const outputWidth =
                quarterTurn
                    ? activeRect.height
                    : activeRect.width;


            const outputHeight =
                quarterTurn
                    ? activeRect.width
                    : activeRect.height;


            if (
                outputCanvas.width !==
                outputWidth
            ) {

                outputCanvas.width =
                    outputWidth;
            }


            if (
                outputCanvas.height !==
                outputHeight
            ) {

                outputCanvas.height =
                    outputHeight;
            }


            updateCanvasDisplaySize();

            updateDiagnostics();
        }


        /*
        ============================================================
        Maximize complete image in browser
        ============================================================
        */

        function updateCanvasDisplaySize() {

            if (
                !outputCanvas.width ||
                !outputCanvas.height
            ) {

                return;
            }


            const availableWidth =
                stage.clientWidth;


            const availableHeight =
                stage.clientHeight;


            if (
                !availableWidth ||
                !availableHeight
            ) {

                return;
            }


            const scale =
                Math.min(

                    availableWidth /
                        outputCanvas.width,

                    availableHeight /
                        outputCanvas.height

                );


            outputCanvas.style.width =
                `${
                    outputCanvas.width *
                    scale
                }px`;


            outputCanvas.style.height =
                `${
                    outputCanvas.height *
                    scale
                }px`;
        }


        /*
        ============================================================
        Draw frame
        ============================================================
        */

        function drawOutputFrame() {

            if (
                sourceVideo.readyState <
                HTMLMediaElement.HAVE_CURRENT_DATA
            ) {

                return;
            }


            const sx =
                activeRect.x;


            const sy =
                activeRect.y;


            const sw =
                activeRect.width;


            const sh =
                activeRect.height;


            const cw =
                outputCanvas.width;


            const ch =
                outputCanvas.height;


            outputContext.save();


            outputContext.setTransform(
                1,
                0,
                0,
                1,
                0,
                0
            );


            outputContext.fillStyle =
                viewerBackground;


            outputContext.fillRect(
                0,
                0,
                cw,
                ch
            );


            switch (
                rotation
            ) {

                case 90:

                    outputContext.translate(
                        cw,
                        0
                    );


                    outputContext.rotate(
                        Math.PI /
                        2
                    );

                    break;


                case 180:

                    outputContext.translate(
                        cw,
                        ch
                    );


                    outputContext.rotate(
                        Math.PI
                    );

                    break;


                case 270:

                    outputContext.translate(
                        0,
                        ch
                    );


                    outputContext.rotate(
                        -Math.PI /
                        2
                    );

                    break;
            }


            outputContext.drawImage(
                sourceVideo,

                sx,
                sy,
                sw,
                sh,

                0,
                0,
                sw,
                sh
            );


            outputContext.restore();
        }


        /*
        ============================================================
        Rendering
        ============================================================
        */

        function renderFrame(
            timestamp
        ) {

            if (
                !rendering
            ) {

                return;
            }


            if (
                timestamp -
                    lastDetectionTime >=
                DETECTION_INTERVAL
            ) {

                lastDetectionTime =
                    timestamp;


                detectActiveRect();
            }


            drawOutputFrame();


            requestAnimationFrame(
                renderFrame
            );
        }


        function startRendering() {

            if (
                rendering
            ) {

                return;
            }


            rendering =
                true;


            lastDetectionTime =
                0;


            requestAnimationFrame(
                renderFrame
            );
        }


        function stopRendering() {

            rendering =
                false;
        }


        /*
        ============================================================
        Diagnostics
        ============================================================
        */

        function updateDiagnostics() {

            if (
                !stream
            ) {

                diagnostics.textContent =
                    "No active video";

                return;
            }


            const track =
                stream
                    .getVideoTracks()[0];


            const inputWidth =
                sourceVideo.videoWidth ||
                "?";


            const inputHeight =
                sourceVideo.videoHeight ||
                "?";


            const outputWidth =
                outputCanvas.width ||
                "?";


            const outputHeight =
                outputCanvas.height ||
                "?";


            diagnostics.textContent =
                `${track.label || "Video Capture"} ` +
                `• Input ${inputWidth}×${inputHeight} ` +
                `• View ${outputWidth}×${outputHeight}`;
        }


        /*
        ============================================================
        Stop capture
        ============================================================
        */

        function stopCapture(
            updateMessage = true
        ) {

            stopRendering();


            if (
                stream
            ) {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );
            }


            stream =
                null;


            sourceVideo.srcObject =
                null;


            outputContext.clearRect(
                0,
                0,
                outputCanvas.width,
                outputCanvas.height
            );


            startup.style.display =
                "flex";


            startButton.disabled =
                false;


            stopButton.disabled =
                true;


            diagnostics.textContent =
                "No active video";


            if (
                updateMessage
            ) {

                setMessage(
                    "Capture stopped."
                );
            }
        }


        /*
        ============================================================
        Start capture
        ============================================================
        */

        async function startCapture() {

            try {

                checkSupport();


                startButton.disabled =
                    true;


                setMessage(
                    "Preparing video devices..."
                );


                await refreshDevices(
                    true
                );


                const deviceId =
                    deviceSelect.value;


                if (
                    !deviceId
                ) {

                    throw new Error(
                        "No video device is selected."
                    );
                }


                stopCapture(
                    false
                );


                setMessage(
                    "Starting capture..."
                );


                const constraints = {

                    audio:
                        false,

                    video: {

                        deviceId: {

                            exact:
                                deviceId
                        },

                        width: {

                            ideal:
                                1920
                        },

                        height: {

                            ideal:
                                1080
                        },

                        frameRate: {

                            ideal:
                                60,

                            max:
                                60
                        }
                    }
                };


                try {

                    stream =
                        await navigator.mediaDevices
                            .getUserMedia(
                                constraints
                            );

                } catch (
                    error
                ) {

                    console.warn(
                        "Preferred capture mode failed. Retrying with device defaults.",
                        error
                    );


                    stream =
                        await navigator.mediaDevices
                            .getUserMedia({

                                audio:
                                    false,

                                video: {

                                    deviceId: {

                                        exact:
                                            deviceId
                                    }
                                }
                            });
                }


                sourceVideo.srcObject =
                    stream;


                await sourceVideo.play();


                resetActiveRect();


                detectActiveRect();


                startRendering();


                startup.style.display =
                    "none";


                startButton.disabled =
                    true;


                stopButton.disabled =
                    false;


                localStorage.setItem(
                    SAVED_DEVICE_KEY,
                    deviceId
                );


                updateDiagnostics();


                setMessage(
                    "Wired capture is live.",
                    "live"
                );


                /*
                Automatically move the toolbar out of the way.
                Its current vertical position is preserved.
                */

                setControlsCollapsed(
                    true
                );


                const track =
                    stream
                        .getVideoTracks()[0];


                track.addEventListener(
                    "ended",
                    () => {

                        stopCapture(
                            false
                        );


                        setMessage(
                            "Capture device disconnected.",
                            "error"
                        );
                    }
                );

            } catch (
                error
            ) {

                console.error(
                    error
                );


                startButton.disabled =
                    false;


                stopButton.disabled =
                    true;


                showCaptureError(
                    error
                );
            }
        }


        /*
        ============================================================
        Errors
        ============================================================
        */

        function showCaptureError(
            error
        ) {

            let text =
                error.message ||
                String(error);


            switch (
                error.name
            ) {

                case "NotAllowedError":

                    text =
                        "Camera access was denied. Allow camera access for this site.";

                    break;


                case "NotFoundError":

                    text =
                        "No compatible video capture device was found.";

                    break;


                case "NotReadableError":

                    text =
                        "Windows found the capture device but could not open it.";

                    break;


                case "SecurityError":

                    text =
                        "The browser or computer security policy blocked camera access.";

                    break;
            }


            setMessage(
                text,
                "error"
            );
        }


        /*
        ============================================================
        Rotation
        ============================================================
        */

        function rotateLeft() {

            rotation -=
                90;


            normalizeRotation();


            updateOutputGeometry();
        }


        function rotateRight() {

            rotation +=
                90;


            normalizeRotation();


            updateOutputGeometry();
        }


        /*
        ============================================================
        Fullscreen
        ============================================================
        */

        async function toggleFullscreen() {

            try {

                if (
                    !document.fullscreenElement
                ) {

                    await document
                        .documentElement
                        .requestFullscreen();

                } else {

                    await document
                        .exitFullscreen();
                }

            } catch (
                error
            ) {

                console.error(
                    error
                );


                setMessage(
                    "Fullscreen mode was blocked by the browser.",
                    "error"
                );
            }
        }


        /*
        ============================================================
        Other events
        ============================================================
        */

        refreshButton.addEventListener(
            "click",
            async () => {

                try {

                    await refreshDevices(
                        true
                    );

                } catch (
                    error
                ) {

                    showCaptureError(
                        error
                    );
                }
            }
        );


        startButton.addEventListener(
            "click",
            startCapture
        );


        stopButton.addEventListener(
            "click",
            () =>
                stopCapture(
                    true
                )
        );


        rotateLeftButton.addEventListener(
            "click",
            rotateLeft
        );


        rotateRightButton.addEventListener(
            "click",
            rotateRight
        );


        backgroundColorPicker.addEventListener(
            "input",
            () => {

                applyBackgroundColor(
                    backgroundColorPicker.value,
                    true
                );
            }
        );


        resetBackgroundButton.addEventListener(
            "click",
            resetBackgroundColor
        );


        fullscreenButton.addEventListener(
            "click",
            toggleFullscreen
        );


        deviceSelect.addEventListener(
            "change",
            () => {

                if (
                    deviceSelect.value
                ) {

                    localStorage.setItem(
                        SAVED_DEVICE_KEY,
                        deviceSelect.value
                    );
                }
            }
        );


        /*
        ============================================================
        Browser resize
        ============================================================
        */

        window.addEventListener(
            "resize",
            () => {

                updateCanvasDisplaySize();


                /*
                Reposition the toolbar using its saved vertical
                anchor, then sync to the actual clamped position.
                */

                positionControls();

                syncToolbarPositionFromActualButton();

                saveToolbarPosition();
            }
        );


        document.addEventListener(
            "fullscreenchange",
            () => {

                requestAnimationFrame(
                    () => {

                        updateCanvasDisplaySize();

                        positionControls();

                        syncToolbarPositionFromActualButton();

                        saveToolbarPosition();
                    }
                );
            }
        );


        /*
        ============================================================
        Source resolution changed
        ============================================================
        */

        sourceVideo.addEventListener(
            "resize",
            () => {

                resetActiveRect();

                detectActiveRect();
            }
        );


        /*
        ============================================================
        Capture device connected/disconnected
        ============================================================
        */

        if (
            navigator.mediaDevices &&
            "addEventListener" in
                navigator.mediaDevices
        ) {

            navigator.mediaDevices
                .addEventListener(
                    "devicechange",
                    async () => {

                        try {

                            await refreshDevices(
                                false
                            );

                        } catch (
                            error
                        ) {

                            console.error(
                                error
                            );
                        }
                    }
                );
        }


        /*
        ============================================================
        Initialize
        ============================================================
        */

        async function initialize() {

            try {

                loadBackgroundColor();


                /*
                Capture the initial arrow position after the browser
                has completed the first layout.
                */

                loadToolbarPosition();


                checkSupport();


                await refreshDevices(
                    false
                );


                setMessage(
                    "Connect the capture card and click Start Capture."
                );

            } catch (
                error
            ) {

                startButton.disabled =
                    true;


                refreshButton.disabled =
                    true;


                showCaptureError(
                    error
                );
            }
        }


        initialize();

    </script>

</body>

</html>
